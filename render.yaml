services:
  - type: web
    name: resqlink-backend
    env: node
    plan: free
    rootDir: Resqlink/backend
    buildCommand: npm install
    startCommand: node src/app.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "true"
